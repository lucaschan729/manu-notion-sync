name: 更新宏利資料
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manulife-excel
          path: output/
          if-no-files-found: warn
